font_family      JetBrainsMono Nerd Font Mono
font_size 10.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# Chinese characters and CJK punctuation
# Install Noto Sans CJK SC separately (Arch: noto-fonts-cjk).
symbol_map U+3000-U+303F,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF,U+20000-U+2FA1F Noto Sans CJK SC

include dracula.conf
